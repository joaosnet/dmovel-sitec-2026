<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120" fill="none">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="yearGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- ITEC Network Globe Symbol -->
  <g transform="translate(10, 10)">
    <!-- Globe Circle -->
    <ellipse cx="50" cy="50" rx="46" ry="46" fill="url(#globeGrad)"/>
    
    <!-- Curved Grid / Telecommunications Network lines -->
    <path d="M 20 22 C 40 40, 45 70, 32 90" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 50 4 C 62 35, 62 68, 52 96" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 12 62 C 38 48, 68 54, 92 72" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 16 38 C 45 28, 75 32, 90 48" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Network Nodes (Telecommunications & Tech) -->
    <circle cx="28" cy="30" r="5.5" fill="#FFFFFF"/>
    <circle cx="58" cy="24" r="5" fill="#FFFFFF"/>
    <circle cx="48" cy="54" r="6" fill="#FFFFFF"/>
    <circle cx="78" cy="62" r="5.5" fill="#FFFFFF"/>
    <circle cx="34" cy="82" r="4.5" fill="#FFFFFF"/>
    <circle cx="86" cy="46" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Typography: SITEC 2026 -->
  <g transform="translate(125, 0)">
    <!-- Tagline: 15ª SEMANA DO INSTITUTO DE TECNOLOGIA -->
    <text x="0" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1.8">15ª SEMANA DO INSTITUTO DE TECNOLOGIA</text>
    
    <!-- Title: SITEC -->
    <text x="0" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">SITEC</text>
    
    <!-- Year: 2026 with Badge / Highlight -->
    <text x="162" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="1">2026</text>
    
    <!-- Institution Pill: ITEC • UFPA -->
    <g transform="translate(0, 84)">
      <rect x="0" y="0" width="140" height="22" rx="6" fill="#0369A1" fill-opacity="0.35" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
      <text x="70" y="15" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#E0F2FE" letter-spacing="1.2">ITEC • UFPA</text>
    </g>
    
    <g transform="translate(150, 84)">
      <rect x="0" y="0" width="130" height="22" rx="6" fill="#065F46" fill-opacity="0.35" stroke="#34D399" stroke-width="1" stroke-opacity="0.4"/>
      <text x="65" y="15" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#A7F3D0" letter-spacing="0.8">1 A 4 DE SETEMBRO</text>
    </g>
  </g>
</svg>
